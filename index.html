<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sieeeeerus quiz results</title>
  <meta name="description" content="Pub quiz results for team Sieeeeerus, season by season.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2313233a'/><text x='16' y='23' font-family='sans-serif' font-size='19' font-weight='800' text-anchor='middle' fill='%23fcfcfb'>S</text></svg>">
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <h1 class="team" aria-label="Sieeeeerus">
        <span>S</span><span>i</span><span class="e e1">e</span><span class="e e2">e</span><span class="e e3">e</span><span class="e e4">e</span><span class="e e5">e</span><span>r</span><span>u</span><span>s</span>
      </h1>
      <p class="tagline">Our pub quiz nights, round by round.</p>
      <nav class="seasons" aria-label="Season" id="season-tabs"></nav>
    </div>
  </header>

  <main class="wrap" id="app" aria-live="polite">
    <p class="loading">Loading results…</p>
  </main>

  <footer class="wrap footer">
    <details>
      <summary>How the scoring works</summary>
      <div id="rules"></div>
    </details>
  </footer>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
